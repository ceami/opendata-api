[project]
name = "opendata-collector"
version = "0.1.0"
description = "Resumable public data.go.kr catalog metadata ingestion into MongoDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "httpx>=0.28,<1",
    "pymongo>=4.13,<5",
]

[project.scripts]
opendata-collect = "opendata_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9", "mongomock>=4.3,<5", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
